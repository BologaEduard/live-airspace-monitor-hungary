[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-airspace-monitor-hungary"
version = "0.1.0"
description = "Live and replay monitoring of Hungarian airspace."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "httpx>=0.28,<1"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.scripts]
airspace-monitor = "airspace_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
